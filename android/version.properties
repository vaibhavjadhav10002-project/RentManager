# Single source of truth for the human-controlled part of the app version.
#
# versionBase = "MAJOR.MINOR"
#
# The release pipeline (.github/workflows/release.yml) appends the CI run
# number as the PATCH digit automatically, e.g. versionBase "1.0" + run #42
# -> versionName "1.0.42", so every release gets a unique, ever-increasing
# name without you touching this file for routine releases.
#
# Bump this manually (e.g. "1.0" -> "1.1" or "2.0") only when you want to
# signal a deliberate minor/major release. Do not edit versionCode anywhere
# -- it is always the CI run number and is never touched by hand.
versionBase=1.0
